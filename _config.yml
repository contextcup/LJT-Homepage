# Site settings
title: "Junteng Liu"
name: "Junteng Liu"
description: "Junteng Liu — natural language processing and machine learning"
url: "https://contextcup.github.io"
baseurl: "/LJT-Homepage"
repository: "contextcup/LJT-Homepage"
locale: "en-US"

# Sidebar
# No avatar or location is specified in the available biographical information.
author:
  name: "Junteng Liu"
  bio: "Ph.D. candidate in Computer Science at HKUST NLP Group"
  employer: "Hong Kong University of Science and Technology"
  email: "jliugi@connect.ust.hk"
  github: "Vicent0205"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  twitter: "junteng88716710"

# Only the About and Publications pages contain personal site content.
include:
  - _pages
exclude:
  - README.md
  - AGENTS.md
  - _posts
  - _drafts
  - _publications
  - _portfolio
  - _talks
  - _teaching
  - _pages/404.md
  - _pages/archive-layout-with-content.md
  - _pages/category-archive.html
  - _pages/collection-archive.html
  - _pages/cv-json.md
  - _pages/cv.md
  - _pages/markdown.md
  - _pages/non-menu-page.md
  - _pages/page-archive.html
  - _pages/portfolio.html
  - _pages/sitemap.md
  - _pages/tag-archive.html
  - _pages/talkmap.html
  - _pages/talks.html
  - _pages/teaching.html
  - _pages/terms.md
  - _pages/year-archive.html
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - node_modules
  - vendor
  - Gemfile
  - Dockerfile
  - package.json
  - markdown_generator
  - scripts
  - talkmap
  - talkmap.py
  - talkmap.ipynb
  - talkmap_out.ipynb
  - files

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
sass:
  sass_dir: _sass
  style: compressed

# Keep existing Academic Pages layouts for the two site pages.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
whitelist:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
